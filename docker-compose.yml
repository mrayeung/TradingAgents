services:
  tradingagents:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  # Backend for the TradingDesk macOS app. The app starts this on launch and
  # talks to it at http://127.0.0.1:8765 over SSE. Built locally for dev; for
  # release the image is shipped inside the .app and docker-loaded on first run.
  desk-server:
    build: .
    image: tradingdesk-engine:dev
    entrypoint: ["desk-server"]
    env_file:
      - path: .env
        required: false
    environment:
      DESK_SERVER_HOST: 0.0.0.0
      DESK_SERVER_PORT: "8765"
      DESK_BASE_DIR: /home/appuser/.tradingagents
      TRADINGAGENTS_NO_DOTENV: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      TRADINGAGENTS_ADVOCATE_LLM_PROVIDER: ${TRADINGAGENTS_ADVOCATE_LLM_PROVIDER:-}
      TRADINGAGENTS_ADVOCATE_LLM_MODEL: ${TRADINGAGENTS_ADVOCATE_LLM_MODEL:-}
      TRADINGAGENTS_ADVOCATE_BACKEND_URL: ${TRADINGAGENTS_ADVOCATE_BACKEND_URL:-}
      TRADINGAGENTS_RISK_LLM_PROVIDER: ${TRADINGAGENTS_RISK_LLM_PROVIDER:-}
      TRADINGAGENTS_RISK_LLM_MODEL: ${TRADINGAGENTS_RISK_LLM_MODEL:-}
      TRADINGAGENTS_RISK_BACKEND_URL: ${TRADINGAGENTS_RISK_BACKEND_URL:-}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
