name: 13F Watcher — Institutional Holdings Monitor

on:
  # Run daily at 8am ET during all four filing windows
  # Q1: Apr 15 – May 15 | Q2: Jul 15 – Aug 14 | Q3: Oct 15 – Nov 14 | Q4: Jan 15 – Feb 14
  schedule:
    - cron: '0 13 15-30 4 *'   # Q1 Apr 15-30
    - cron: '0 13 1-15 5 *'    # Q1 May 1-15
    - cron: '0 13 15-31 7 *'   # Q2 Jul 15-31
    - cron: '0 13 1-14 8 *'    # Q2 Aug 1-14
    - cron: '0 13 15-31 10 *'  # Q3 Oct 15-31
    - cron: '0 13 1-14 11 *'   # Q3 Nov 1-14
    - cron: '0 13 15-31 1 *'   # Q4 Jan 15-31
    - cron: '0 13 1-14 2 *'    # Q4 Feb 1-14

  # Allow manual trigger anytime (useful for testing or re-running after a miss)
  workflow_dispatch:
    inputs:
      cik:
        description: 'Single CIK to process (leave blank for all watched institutions)'
        required: false
        default: ''

jobs:
  watch-13f:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # to commit state files back to repo
      issues: write        # to open alert issues on new filings

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run 13F Watcher
        id: watcher
        run: |
          if [ -n "${{ github.event.inputs.cik }}" ]; then
            python trading_desk/scripts/edgar_13f_watcher.py \
              --cik "${{ github.event.inputs.cik }}" \
              --output-json /tmp/13f_result.json
          else
            python trading_desk/scripts/edgar_13f_watcher.py \
              --output-json /tmp/13f_result.json
          fi

      - name: Check for new filings
        id: check
        run: |
          if [ -f /tmp/13f_result.json ]; then
            COUNT=$(python -c "import json; d=json.load(open('/tmp/13f_result.json')); print(len(d.get('new_filings', [])))")
            echo "new_filing_count=$COUNT" >> $GITHUB_OUTPUT
            echo "Found $COUNT new filing(s)"
          else
            echo "new_filing_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated state files
        if: steps.check.outputs.new_filing_count != '0'
        run: |
          git config user.name "oasis-13f-bot"
          git config user.email "bot@oasis-terminal"
          git add trading_desk/data/13f/
          git diff --staged --quiet || git commit -m "chore(13f): update snapshots — $(date -u +%Y-%m-%d)"
          git push

      - name: Open GitHub Issue for each new filing
        if: steps.check.outputs.new_filing_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import json, subprocess, os

          result = json.load(open("/tmp/13f_result.json"))
          for filing in result.get("new_filings", []):
              institution = filing["institution"]
              filed_date  = filing["filing"]["filing_date"]
              accession   = filing["filing"]["accession_number"]
              diff        = filing["diff"]

              def fmt_positions(positions, prefix, limit=15):
                  lines = []
                  for p in positions[:limit]:
                      val = f"${p['value_usd']:,.0f}"
                      chg = f" ({p.get('shares_change_pct', 0):+.1f}%)" if 'shares_change_pct' in p else ""
                      lines.append(f"| {prefix} | {p['name']} | {val}{chg} | {p['cusip']} |")
                  return "\n".join(lines)

              body = f"""## 📋 New 13F-HR Filing Detected

          **Institution:** {institution}
          **Filed:** {filed_date}
          **Accession:** `{accession}`
          **EDGAR Link:** https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK={filing['cik']}&type=13F-HR&dateb=&owner=include&count=1

          ---

          ### 🟢 New Positions ({len(diff['new_positions'])})
          | | Name | Value | CUSIP |
          |---|---|---|---|
          {fmt_positions(diff['new_positions'], '+')}

          ### 🔴 Exits ({len(diff['exited'])})
          | | Name | Prior Value | CUSIP |
          |---|---|---|---|
          {fmt_positions(diff['exited'], '-')}

          ### 🔼 Significant Adds ({len(diff['added'])})
          | | Name | Current Value | CUSIP |
          |---|---|---|---|
          {fmt_positions(diff['added'], '▲')}

          ### 🔽 Significant Trims ({len(diff['trimmed'])})
          | | Name | Current Value | CUSIP |
          |---|---|---|---|
          {fmt_positions(diff['trimmed'], '▼')}

          ---
          *Unchanged positions: {diff['unchanged_count']} | Generated by Oasis 13F Watcher*
          """

              title = f"[13F] {institution} — Q filing detected ({filed_date})"
              subprocess.run([
                  "gh", "issue", "create",
                  "--title", title,
                  "--body", body,
                  "--label", "13f,institutional,auto"
              ], check=True)

          EOF

      - name: No new filings summary
        if: steps.check.outputs.new_filing_count == '0'
        run: echo "✅ No new 13F filings found for watched institutions."
